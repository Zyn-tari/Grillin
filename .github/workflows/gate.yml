name: gate

# The hook is local and skippable. This is the copy nobody can skip.
#
# It runs the same two things the pre-commit hook runs, for the same reason:
# the validator is an instrument, and an instrument that has not been calibrated
# against a known answer authorises every measurement downstream of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calibration:
    name: the gate is calibrated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: known-good fixture must PASS
        run: |
          ./scripts/validate-plan.py examples/minimal-passing-plan --run-gates
          echo "exit 0 as required"

      - name: known-bad example must FAIL
        run: |
          if ./scripts/validate-plan.py examples/a-real-first-plan --run-gates; then
            echo "::error::The known-bad example passed. A gate that passes everything catches nothing."
            exit 1
          fi
          echo "exit 1 as required"

      - name: a run without --run-gates must report INCOMPLETE, not success
        run: |
          set +e
          ./scripts/validate-plan.py examples/minimal-passing-plan > /dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::Expected exit 2 (INCOMPLETE), got $rc. The cheap half of the check must not read as the whole of it."
            exit 1
          fi
          echo "exit 2 as required"

      - name: every new check fires on its own defect
        run: |
          fail=0
          probe() { # name, check, mutation
            rm -rf /tmp/mut && cp -r examples/minimal-passing-plan /tmp/mut
            sed -i 's|\[`../a-real-first-plan`\](../a-real-first-plan)|the failing example|' /tmp/mut/PLAN.md
            ( cd /tmp/mut && eval "$3" )
            if ./scripts/validate-plan.py /tmp/mut --run-gates 2>&1 | grep -q "^FAIL — $2"; then
              echo "  ok    $1"
            else
              echo "::error::$1 did not fire — check '$2' is dead"; fail=1
            fi
          }
          probe adversary-missing    adversary           "sed -i '/Reader:/d' tasks/T4/TASK.md"
          probe adversary-dirty      adversary           "sed -i 's/^\*\*Owner:\*\* reviewer/**Owner:** worker-a/' tasks/T4/TASK.md"
          probe plan-truth-edge      plan-truth          "sed -i 's/worker-a | T2 |/worker-a | T1 |/' PLAN.md"
          probe confirmed-no-cmd     confirmed-exercised "printf '\n| F-1 | a thing | CONFIRMED |\n' >> PLAN.md"
          probe human-not-delivered  frozen-contract     "sed -i 's/^\*\*Owner:\*\* worker-a/**Owner:** human/;s/^\*\*Status:\*\* NOT STARTED/**Status:** IN PROGRESS/' tasks/T1/TASK.md"
          probe missing-binary-gate  gate-fails-first    "sed -i 's|test -f findings/T2.md|definitelynotarealbinary --check|' tasks/T2/TASK.md"
          probe rollback-missing     rollback            "sed -i 's|^\*\*Owner:\*\* worker-a|**Owner:** worker-a\n**Reversible:** no|' tasks/T1/TASK.md"
          probe rollback-prose       rollback            "sed -i 's|^\*\*Owner:\*\* worker-a|**Owner:** worker-a\n**Reversible:** no\n**Rollback:** just undo it|' tasks/T1/TASK.md"
          probe paths-collide        paths-disjoint      "sed -i 's|\`findings/T2.md\`|\`findings/T1.md\`|' tasks/T2/TASK.md; sed -i 's|^\*\*Blocked by:\*\* T1|**Blocked by:** —|' tasks/T2/TASK.md; sed -i 's|\*\*Blocks:\*\* T2|**Blocks:** —|' tasks/T1/TASK.md"
          probe effort-too-low       persona-model       "sed -i 's/\*\*Effort:\*\* high/**Effort:** medium/' tasks/T1/TASK.md"
          probe model-is-tier-word   persona-model       "sed -i 's/\`claude-sonnet-5\`/\`top\`/' tasks/T1/TASK.md"
          probe persona-not-rostered persona-model       "sed -i 's/\`recon\`/\`freelancer\`/' tasks/T1/TASK.md"
          # The delegation node's config. Opt-in by file, so each probe writes one.
          RUL='[[ruling]]\nclass = \"receipt-trust\"\nwhen = \"verdict.passed\"\npersona = \"judge\"\nevidence = [\"receipt\"]\noutcomes = [\"accept\", \"reject\", \"insufficient-evidence\"]\ndefault = \"halt\"\n'
          probe ruling-soft-default  rulings             "printf '$RUL' | sed 's/\"halt\"/\"accept\"/' > _RULINGS.toml"
          probe ruling-no-out        rulings             "printf '$RUL' | sed 's/, \"insufficient-evidence\"//' > _RULINGS.toml"
          probe ruling-judges-self   rulings             "printf '$RUL' | sed 's/\"judge\"/\"recon\"/' > _RULINGS.toml"
          probe ruling-unrostered    rulings             "printf '$RUL' | sed 's/\"judge\"/\"nobody\"/' > _RULINGS.toml"
          probe ruling-unparseable   rulings             "printf '[[ruling]\\nclass = ' > _RULINGS.toml"
          # The OTHER reader role. An agent briefed from QUICKSTART alone staffed
          # the adversary and left this one out; it caught ~20 on the reference run.
          probe health-missing       health-checker      "rm -rf tasks/T5"
          probe adv-no-context       adversary-context   "sed -i '/^\*\*Context:\*\*/d' tasks/T4/TASK.md"
          probe adv-is-subagent      adversary-context   "sed -i 's|^\*\*Context:\*\* fresh.*|**Context:** a subagent of the orchestrator|' tasks/T4/TASK.md"
          # A stated size band nobody enforced became 5 tasks in a watched trial.
          probe size-missing         size-declared       "sed -i '/^\*\*Size:\*\*/d' PLAN.md"
          probe size-out-of-band     size-declared       "sed -i 's|^\*\*Size:\*\* S|**Size:** XS|' PLAN.md"
          # A task graded against a baseline inside its own folder passes whether
          # or not the work happened. Found by a first-time user on her own plan.
          probe done-self-ref        done-self-reference "sed -i 's|test -f findings/T2.md|python3 x.py | diff -u tasks/T2/baseline.txt -|' tasks/T2/TASK.md"
          # Plan-level invariants. Opt-in by file, so each probe writes one. The
          # last is the one Smokin cannot make: a done-command wearing an
          # invariant's clothes measures completion, never blast radius.
          INV='[[invariant]]\nname = \"the neighbour still answers\"\nrun = \"printf 200\"\nbecause = \"this plan touches a shared server\"\n'
          probe inv-no-entries       invariants          "printf '[policy]\\nbudget_s = 30\\n' > _INVARIANTS.toml"
          probe inv-unparseable      invariants          "printf '[[invariant]\\nname = ' > _INVARIANTS.toml"
          probe inv-no-because       invariants          "printf '$INV' | grep -v because > _INVARIANTS.toml"
          probe inv-agent-binary     invariants          "printf '$INV' | sed 's|printf 200|claude -p check|' > _INVARIANTS.toml"
          probe inv-unknown-key      invariants          "{ printf '$INV'; printf 'mode = \"strict\"\\n'; } > _INVARIANTS.toml"
          probe inv-is-done-command  invariants          "printf '$INV' | sed 's|printf 200|test -f findings/T2.md|' > _INVARIANTS.toml"
          # A research task is graded on the findings it writes, never on what it
          # found. Five first-time users each invented this task type; none of
          # them could have been told they had got it wrong.
          probe research-no-timebox  research-task       "sed -i '0,/^\*\*Status:/s//**Kind:** research\n**Status:/' tasks/T1/TASK.md"
          probe research-no-artefact research-task       "sed -i '0,/^\*\*Status:/s//**Kind:** research · **Timebox:** 90 minutes\n**Status:/' tasks/T1/TASK.md"
          exit $fail

      - name: owner resolution and disclaimed paths
        run: python3 tests/test-owner-and-ownership.py

      - name: a plan of people passes, and the floor is still there
        run: bash tests/test-human-workers.sh

      - name: the research-first example is a valid plan
        run: ./scripts/validate-plan.py examples/research-first-plan --run-gates

      - name: the authoring gate and the runtime loader still agree
        run: |
          # Grillin re-states limits that live in Smokin's loaders. Copies drift,
          # and the drift is invisible until a plan that passed the gate halts at
          # tick 1. This is the assertion. It needs Smokin beside the checkout;
          # when that is unavailable it fails rather than skipping quietly.
          if [ -d "${SMOKIN_HOME:-$HOME/smokin}" ]; then
            python3 tests/test-config-contract.py
          else
            echo "::warning::smokin not present — the cross-tool assertion did not run"
          fi

      - name: the one-task example is a valid plan
        run: ./scripts/validate-plan.py examples/one-task-plan --run-gates

      - name: check-index fires on each of its four defects
        run: bash tests/test-check-index.sh

      - name: the installed hook gates a plan at the repository root
        run: bash tests/test-hook-gates-root-plan.sh

      - name: links resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = 0
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts or 'a-real-first-plan' in md.parts:
                  continue          # that example ships with dangling links on purpose
              for i, line in enumerate(md.read_text(errors='replace').splitlines(), 1):
                  for t in re.findall(r'\[[^\]]*\]\(([^)#][^)]*)\)', line):
                      t = t.split('#')[0].strip()
                      if not t or '://' in t or t.startswith('mailto:'):
                          continue
                      if not (md.parent / t).exists():
                          print(f"::error file={md},line={i}::dangling link {t!r}")
                          bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: the machine-readable surfaces parse
        run: python3 -c "import json;json.load(open('SCALING.json'));print('SCALING.json ok')"

      - name: the four surfaces agree
        run: ./scripts/check-drift.py

      - name: every entry surface carries the scoping boundary
        run: ./scripts/check-boundary.py
